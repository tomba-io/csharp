name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/Tomba.sln

      - name: Check formatting
        run: dotnet format src/Tomba.sln --verify-no-changes --verbosity diagnostic

      - name: Build
        run: dotnet build src/Tomba.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Tomba.sln --configuration Release --no-build --verbosity normal
